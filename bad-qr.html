
<!DOCTYPE html>
<html>
<head>
<style>

body {
    background-color: black;
    color: #00FF00;
    font-family: "Courier New", monospace;
    font-size: 32px;
    padding: 30px;
}

.intro-line {
    opacity: 0;
    animation: appear 1s forwards;
}

.bottom-text a {
	color: #8B0000;
	font-size: 45px;
	position: fixed;
	bottom: 25px;
	width: 100%
	}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

</style>
</head>

<body>
	
<div id="introduction"></div>

<script>
const lines = [
    "Scanning for banking information...",
    "Scanning for payment card information...",
	"Scanning for cryptocurrencies...",
	"Scanning for passwords and passkeys...",
    "Scanning for contacts...",
    "You've been pwned!",
	"Just kidding, scan QR codes at your own risk for:",
	"Curiosity killed the cat,",
	"but satisfaction brought him back.",
];
	
const container = document.getElementById("introduction");

lines.forEach((line, index) => {
    setTimeout(() => {
        const paragraph = document.createElement("p");
        paragraph.className = "intro-line";
        paragraph.textContent = line;
        container.appendChild(paragraph);
    }, index * 2000);
});
</script>

<div class="bottom-text">
	<a href="https://frankwjohns13.github.io/?ref=bad-qr">My Cybersecurity Journey</a>
</div>
	
</body>
</html>
